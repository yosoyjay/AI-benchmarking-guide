[project]
name = "ai-benchmarking-guide"
version = "0.1.0"
description = "Performance benchmarks for Azure GPU SKUs (NVIDIA and AMD)"
requires-python = ">=3.10"
dependencies = [
    "cmake==3.30.2",
    "matplotlib",
    "ninja==1.11.1.1",
    "numpy",
    "packaging>=24.1",
    "prettytable==3.11.0",
]

[project.optional-dependencies]
nvidia = [
    "click==8.2.1",
    "datasets",
    "docker==7.1.0",
    "einops==0.8.0",
    "huggingface-hub==0.26.2",
    "psutil==7.0.0",
    "pydantic",
    "setuptools==79.0.1",
    "sympy>=1.13.1",
    "torch==2.7.0",
    "torchvision==0.22.0",
    "transformers==4.48.0",
    "wheel",
]
amd = [
    "docker==7.1.0",
    "einops==0.8.0",
    "huggingface-hub==0.26.2",
    "ninja==1.11.1.1",
    "packaging>=24.1",
    "psutil==7.0.0",
    "setuptools==79.0.1",
    "sympy>=1.13.1",
    "transformers==4.48.0",
    "wheel",
]
flash-attn = [
    "flash-attn==2.8.1",
]
dev = [
    "black",
    "pre-commit",
    "pytest",
    "ruff",
]

[tool.setuptools]
packages = []

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["Azure_Results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line length handled by black
]

[tool.ruff.lint.isort]
known-first-party = ["benchmarks", "infra"]

[tool.black]
line-length = 120
target-version = ["py310"]
exclude = "Azure_Results"

[tool.pytest.ini_options]
testpaths = ["tests"]
